<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase 登录示例</title>
<style>
  :root {
    --bg: #f6f1e7;
    --surface: #fffdf9;
    --surface2: #efe7d8;
    --border: #ddd0b8;
    --text: #2c261c;
    --muted: #8a7d68;
    --danger: #c04f4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

  .btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; margin-bottom: 10px; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn.google { background: #fff; }
  .btn.facebook { background: #1877f2; color: #fff; border-color: #1877f2; }
  .btn.apple { background: #000; color: #fff; border-color: #000; }

  .user-box { display: none; text-align: center; }
  .user-box.active { display: block; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px; background: var(--surface2); object-fit: cover; }
  .user-name { font-size: 16px; font-weight: 700; }
  .user-email { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .user-provider { font-size: 11px; color: var(--muted); margin-top: 8px; background: var(--surface2); display: inline-block; padding: 3px 10px; border-radius: 10px; }
  .signout-btn {
    margin-top: 20px; width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--danger); font-size: 13px; cursor: pointer;
  }

  .login-box { display: block; }
  .login-box.hidden { display: none; }

  .status { font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center; min-height: 16px; }
  .status.error { color: var(--danger); }

  .setup-banner {
    display: none;
    background: rgba(192,79,79,.08); border: 1px solid rgba(192,79,79,.25);
    border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.7; margin-bottom: 20px;
  }
  .setup-banner.show { display: block; }
  .setup-banner code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<div class="card">
  <h1>登录示例</h1>
  <div class="sub">Firebase Authentication · Google / Facebook / Apple</div>

  <div id="setupBanner" class="setup-banner">
    还没有配置 Firebase，请按仓库 README.md 的步骤创建项目并填入 <code>firebaseConfig</code>。
  </div>

  <div class="login-box" id="loginBox">
    <button class="btn google" id="btnGoogle">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.2-2 13.9-5.4l-6.4-5.4C29.4 35.6 26.8 36 24 36c-5.3 0-9.8-3.3-11.4-8l-6.6 5.1C9.6 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.4 5.4C41 35 45 30 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      使用 Google 继续
    </button>
    <button class="btn facebook" id="btnFacebook" disabled title="暂未开放">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
      使用 Facebook 继续
    </button>
    <button class="btn apple" id="btnApple" disabled title="暂未开放">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.7 1c.1 1.2-.4 2.4-1.1 3.3-.7.9-1.9 1.6-3 1.5-.1-1.2.4-2.4 1.1-3.2.8-.9 2.1-1.6 3-1.6zM20.9 17.4c-.5 1.2-.8 1.7-1.5 2.7-1 1.4-2.3 3.2-4 3.2-1.5 0-1.9-1-3.9-1s-2.5 1-3.9 1c-1.7 0-3-1.6-4-3-1.9-2.7-3.3-7.7-1.4-11 .9-1.7 2.6-2.7 4.4-2.8 1.5 0 2.9 1 3.9 1s2.7-1.2 4.5-1c.8.1 3 .3 4.4 2.4-.1.1-2.6 1.6-2.6 4.7.1 3.7 3.2 4.9 3.1 4.9z"/></svg>
      使用 Apple 继续
    </button>
    <div class="status" id="status"></div>
  </div>

  <div class="user-box" id="userBox">
    <img class="avatar" id="userAvatar" src="" alt="">
    <div class="user-name" id="userName"></div>
    <div class="user-email" id="userEmail"></div>
    <div class="user-provider" id="userProvider"></div>
    <button class="signout-btn" id="btnSignOut">退出登录</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script>
// ── 1. 在 Firebase 控制台创建 Web 应用后，把拿到的配置对象贴在这里 ──
// 详细步骤见仓库 README.md
const firebaseConfig = {
  apiKey: "AIzaSyC60jZW607i9gluUyJcluJNwVZKijn5qi0",
  authDomain: "fir-authdemo-8aa88.firebaseapp.com",
  projectId: "fir-authdemo-8aa88",
  storageBucket: "fir-authdemo-8aa88.firebasestorage.app",
  messagingSenderId: "242221451091",
  appId: "1:242221451091:web:60761c2b411960d5e143a6",
};

const $ = (id) => document.getElementById(id);
const NOT_CONFIGURED = firebaseConfig.apiKey === 'YOUR_API_KEY';

function setStatus(msg, isError) {
  const el = $('status');
  el.textContent = msg || '';
  el.classList.toggle('error', !!isError);
}

/**
 * window.AuthBridge —— 预留给以后 Unity WebGL 调用的接口层。
 * Unity 的 .jslib 可以直接调用这里的方法（都是同步触发/返回 Promise 的普通函数，
 * 不依赖任何框架），登录状态变化通过 onChange 注册的回调广播出去，
 * 到时候在回调里调 unityInstance.SendMessage(...) 把结果传回 Unity 侧即可。
 */
const AuthBridge = {
  _listeners: [],
  onChange(cb) { this._listeners.push(cb); },
  _emit(user) {
    const payload = user ? serializeUser(user) : null;
    this._listeners.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
  },
  getCurrentUser() {
    const u = auth && auth.currentUser;
    return u ? serializeUser(u) : null;
  },
  signInWithGoogle() { return signInWith(googleProvider); },
  signInWithFacebook() { return signInWith(facebookProvider); },
  signInWithApple() { return signInWith(appleProvider); },
  signOut() { return auth.signOut(); },
};
window.AuthBridge = AuthBridge;

function serializeUser(u) {
  return {
    uid: u.uid,
    displayName: u.displayName || '',
    email: u.email || '',
    photoURL: u.photoURL || '',
    providerId: (u.providerData[0] && u.providerData[0].providerId) || '',
  };
}

let auth, googleProvider, facebookProvider, appleProvider;

function initFirebase() {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  googleProvider = new firebase.auth.GoogleAuthProvider();
  facebookProvider = new firebase.auth.FacebookAuthProvider();
  appleProvider = new firebase.auth.OAuthProvider('apple.com');

  auth.onAuthStateChanged(user => {
    renderUser(user);
    AuthBridge._emit(user);
  });
}

async function signInWith(provider) {
  setStatus('');
  try {
    const result = await auth.signInWithPopup(provider);
    setStatus('');
    return serializeUser(result.user);
  } catch (e) {
    console.error(e);
    setStatus(describeError(e), true);
    throw e;
  }
}

function describeError(e) {
  if (e.code === 'auth/unauthorized-domain') return '当前域名未加入 Firebase 授权域名列表，见 README.md';
  if (e.code === 'auth/popup-closed-by-user') return '登录窗口被关闭了，再试一次';
  if (e.code === 'auth/account-exists-with-different-credential') return '这个邮箱已经用别的登录方式注册过了';
  return '登录失败：' + (e.message || e.code || '未知错误');
}

function renderUser(user) {
  if (user) {
    $('loginBox').classList.add('hidden');
    $('userBox').classList.add('active');
    $('userAvatar').src = user.photoURL || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23efe7d8%22/><text x=%2250%22 y=%2262%22 font-size=%2240%22 text-anchor=%22middle%22>👤</text></svg>';
    $('userName').textContent = user.displayName || '(未设置昵称)';
    $('userEmail').textContent = user.email || '';
    $('userProvider').textContent = (user.providerData[0] && user.providerData[0].providerId) || '';
  } else {
    $('loginBox').classList.remove('hidden');
    $('userBox').classList.remove('active');
  }
}

$('btnGoogle').addEventListener('click', () => signInWith(googleProvider));
$('btnFacebook').addEventListener('click', () => signInWith(facebookProvider));
$('btnApple').addEventListener('click', () => signInWith(appleProvider));
$('btnSignOut').addEventListener('click', () => auth.signOut());

if (NOT_CONFIGURED) {
  $('setupBanner').classList.add('show');
  ['btnGoogle', 'btnFacebook', 'btnApple'].forEach(id => $(id).disabled = true);
} else {
  initFirebase();
}
</script>
</body>
</html>
